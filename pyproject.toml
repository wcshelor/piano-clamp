[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-clamp"
version = "0.1.0"
description = "A dataset consumer that validates manifests, extracts features, creates embeddings, analyzes embeddings, and renders review/result artifacts from external piano datasets"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "music21>=9.1,<10",
  "mido>=1.3,<2",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
piano-clamp = "piano_clamp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
