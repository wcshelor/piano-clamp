name: piano-clamp-env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - numpy=1.26
  - pandas>=2
  - matplotlib>=3.8
  - packaging=23.2
  - pyyaml>=6
  - scikit-learn>=1.5
  - music21>=9.1,<10
  - mido>=1.3,<2
  - libsndfile
  - pytest>=8
  - pip:
      - -e .
      - -r vendor/clamp3/requirements.txt
      - huggingface-hub>=0.26.0,<1.0
      - soundfile>=0.12,<1
